<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 288" role="img" aria-labelledby="title desc">
  <title id="title">BoBoDai · Junbo Dai</title>
  <desc id="desc">A profile banner with moving signals along circuit traces.</desc>
  <style>
    @media (prefers-color-scheme: dark) {
      .stop-color-paper { stop-color: #101b25; }
      .stop-color-board { stop-color: #152f36; }
      .fill-trace { fill: #4b807e; }
      .stroke-trace { stroke: #4b807e; }
      .fill-board { fill: #152f36; }
      .stroke-signal { stroke: #79ead1; }
      .stroke-hot { stroke: #ffac75; }
      .fill-paper { fill: #101b25; }
      .stroke-edge { stroke: #294650; }
      .fill-ink { fill: #f0faf9; }
      .fill-secondary { fill: #a7c2cc; }
    }
    .signal { animation: travel 6s linear infinite; }
    .return { animation-delay: -2.7s; }
    .branch { animation-delay: -4.4s; }
    .core { animation: glow 4s ease-in-out infinite; }
    @keyframes travel { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -100; } }
    @keyframes glow { 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) {
      .signal, .core { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="background">
      <stop offset="35%" class="stop-color-paper" stop-color="#f3f9f8"/>
      <stop offset="100%" class="stop-color-board" stop-color="#dcefeb"/>
    </linearGradient>
    <linearGradient id="grid-fade">
      <stop offset="18%" stop-color="black"/>
      <stop offset="82%" stop-color="white"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" class="fill-trace" fill="#548f8a" opacity=".47"/>
    </pattern>
    <mask id="grid-mask">
      <rect width="880" height="288" fill="url(#grid-fade)"/>
    </mask>
    <clipPath id="card">
      <rect x="1" y="1" width="878" height="286" rx="23"/>
    </clipPath>
    <path id="feed" pathLength="100" d="M456 107H510L541 76H604L629 101H664M740 101H764L789 76H853"/>
    <path id="loop" pathLength="100" d="M852 207H795L767 180H740M664 180H616L581 215H497L469 187H414"/>
    <path id="spur" pathLength="100" d="M704 31V68L720 84V103M696 184V208L727 239V263"/>
  </defs>

  <g clip-path="url(#card)">
    <rect width="880" height="288" fill="url(#background)"/>
    <rect x="340" width="540" height="288" fill="url(#dots)" mask="url(#grid-mask)"/>

    <g fill="none" class="stroke-trace" stroke="#548f8a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path opacity=".5" d="M487 131H540L573 102H598L629 130H664M740 130H778L815 102H836M740 154H768L797 171H854M664 154H617L585 184H532M683 103V86L651 55H599M723 184V196L746 219H766L792 245H842"/>
      <use href="#feed"/>
      <use href="#loop"/>
      <use href="#spur"/>
      <g class="fill-board" fill="#dcefeb">
        <circle cx="456" cy="107" r="5"/><circle cx="853" cy="76" r="5"/>
        <circle cx="852" cy="207" r="5"/><circle cx="414" cy="187" r="5"/>
        <circle cx="704" cy="31" r="5"/><circle cx="727" cy="263" r="5"/>
        <circle cx="599" cy="55" r="4"/><circle cx="842" cy="245" r="4"/>
      </g>
    </g>

    <g fill="none" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="7 93">
      <use href="#feed" class="signal stroke-signal" stroke="#086e5e" stroke-dashoffset="-12"/>
      <use href="#loop" class="signal return stroke-signal" stroke="#086e5e" stroke-dashoffset="-56"/>
      <use href="#spur" class="signal branch stroke-hot" stroke="#ad4b21" stroke-dashoffset="-22"/>
    </g>

    <rect x="664" y="101" width="76" height="83" rx="12" class="fill-paper stroke-trace" fill="#f3f9f8" stroke="#548f8a" stroke-width="2"/>
    <rect x="674" y="111" width="56" height="63" rx="7" fill="none" class="stroke-edge" stroke="#b9d2ce"/>
    <path d="M682 144H691L697 133L704 152L710 140H722" fill="none" class="core stroke-hot" stroke="#ad4b21" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>

    <text x="48" y="144" font-family="system-ui, sans-serif" font-size="76" font-weight="750" letter-spacing="-4" class="fill-ink" fill="#102b34">BoBoDai</text>
    <text x="52" y="192" font-family="ui-monospace, Menlo, monospace" font-size="28" class="fill-secondary" fill="#365861">Junbo Dai</text>
    <path d="M52 223H112" class="stroke-signal" stroke="#086e5e" stroke-width="4" stroke-linecap="round"/>
  </g>
  <rect x="1" y="1" width="878" height="286" rx="23" fill="none" class="stroke-edge" stroke="#b9d2ce" stroke-width="2"/>
</svg>
