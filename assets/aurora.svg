<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" role="img" aria-labelledby="title description">
  <title id="title">BoBoDai</title>
  <desc id="description">Neon auroras curl around a star field behind the BoBoDai wordmark.</desc>
  <style>
    .north { animation: north 12s ease-in-out infinite alternate; }
    .south { animation: south 15s ease-in-out infinite alternate; }
    .twinkle { animation: twinkle 4s ease-in-out infinite alternate; }
    .twinkle-delayed { animation-delay: -2s; }
    .meteor { animation: meteor 9s ease-in infinite; }
    .satellite { animation: orbit 17s linear infinite; }
    @keyframes north { to { transform: translate(-18px, 28px) skewX(-5deg); } }
    @keyframes south { to { transform: translate(16px, -20px) skewX(5deg); } }
    @keyframes twinkle { from { opacity: .33; } to { opacity: 1; } }
    @keyframes meteor {
      0%, 57% { transform: translate(95px, -65px); opacity: 0; }
      61% { opacity: 1; }
      72%, 100% { transform: translate(-145px, 96px); opacity: 0; }
    }
    @keyframes orbit { to { stroke-dashoffset: -100; } }
    @media (prefers-reduced-motion: reduce) {
      .north, .south, .twinkle, .meteor, .satellite { animation: none; }
      .meteor { opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="space" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#151c4a"/>
      <stop offset=".47" stop-color="#09091f"/>
      <stop offset="1" stop-color="#220c39"/>
    </linearGradient>
    <linearGradient id="cyan" x2="1" y2=".2" gradientUnits="objectBoundingBox">
      <stop stop-color="#308bff" stop-opacity="0"/>
      <stop offset=".22" stop-color="#438eff"/>
      <stop offset=".47" stop-color="#9f77ff"/>
      <stop offset=".72" stop-color="#ff71d2"/>
      <stop offset="1" stop-color="#ffacde" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pink" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#9d52ff" stop-opacity="0"/>
      <stop offset=".22" stop-color="#f069e8"/>
      <stop offset=".47" stop-color="#946aff"/>
      <stop offset=".75" stop-color="#36e1fb"/>
      <stop offset="1" stop-color="#8afbf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="word" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fff"/>
      <stop offset=".48" stop-color="#f7edff"/>
      <stop offset="1" stop-color="#d2baff"/>
    </linearGradient>
    <linearGradient id="shoot" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#fff"/>
      <stop offset=".3" stop-color="#92e4ff"/>
      <stop offset="1" stop-color="#92e4ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shade">
      <stop offset=".24" stop-color="#0b0823" stop-opacity=".85"/>
      <stop offset="1" stop-color="#0b0823" stop-opacity="0"/>
    </radialGradient>
    <filter id="wide" x="-.2" y="-.7" width="1.4" height="2.4">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <filter id="soft" x="-.2" y="-.4" width="1.4" height="1.8">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="card"><rect width="880" height="350" rx="24"/></clipPath>
    <path id="ribbon-north" d="M-52 198C120 222 151-33 331 42S549 112 645 50 794-23 931 70"/>
    <path id="ribbon-south" d="M-72 261C86 335 201 367 310 297S472 227 565 272 731 332 956 147"/>
    <path id="ring" pathLength="100" d="M163 244C149 217 262 174 416 139S702 99 716 125 620 194 465 229 178 271 163 244Z"/>
    <path id="star" d="M0-10Q1-1 10 0 1 1 0 10-1 1-10 0-1-1 0-10Z"/>
  </defs>

  <g clip-path="url(#card)">
    <rect width="880" height="350" fill="url(#space)"/>
    <g class="north" fill="none" stroke="url(#cyan)">
      <use href="#ribbon-north" stroke-width="64" opacity=".36" filter="url(#wide)"/>
      <use href="#ribbon-north" stroke-width="18" opacity=".43" filter="url(#soft)"/>
      <path d="M-67 191C125 225 144-44 326 39S545 109 646 46 819-27 941 60" stroke-width="1.3" opacity=".9"/>
      <path d="M-51 210C133 249 159-9 332 53S556 127 661 58 818 4 942 76" stroke-width="1" opacity=".57"/>
      <path d="M-64 224C127 252 159 4 324 61S550 141 660 68 830 7 943 88" stroke-width="1" opacity=".33"/>
    </g>
    <g class="south" fill="none" stroke="url(#pink)">
      <use href="#ribbon-south" stroke-width="70" opacity=".42" filter="url(#wide)"/>
      <use href="#ribbon-south" stroke-width="20" opacity=".48" filter="url(#soft)"/>
      <path d="M-80 242C69 324 199 364 306 288S478 224 571 265 740 318 946 135" stroke-width="1.4" opacity=".92"/>
      <path d="M-66 263C83 348 208 363 314 299S473 231 568 276 745 329 942 151" stroke-width="1" opacity=".68"/>
      <path d="M-65 273C84 356 204 375 319 309S482 242 569 288 745 334 949 159" stroke-width="1" opacity=".4"/>
    </g>

    <g fill="#d8e6ff" opacity=".5">
      <circle cx="46" cy="83" r="1.5"/><circle cx="85" cy="130" r="1"/><circle cx="174" cy="44" r="1.4"/>
      <circle cx="201" cy="126" r="1.2"/><circle cx="234" cy="88" r="1.6"/><circle cx="274" cy="120" r="1"/>
      <circle cx="380" cy="72" r="1.2"/><circle cx="478" cy="54" r="1.3"/><circle cx="526" cy="30" r="1.5"/>
      <circle cx="702" cy="89" r="1.3"/><circle cx="760" cy="65" r="1"/><circle cx="836" cy="105" r="1.5"/>
      <circle cx="57" cy="269" r="1.2"/><circle cx="114" cy="212" r="1.5"/><circle cx="205" cy="304" r="1.2"/>
      <circle cx="284" cy="268" r="1.4"/><circle cx="375" cy="305" r="1.3"/><circle cx="467" cy="284" r="1"/>
      <circle cx="625" cy="298" r="1.2"/><circle cx="702" cy="270" r="1.4"/><circle cx="816" cy="304" r="1.5"/>
    </g>
    <g class="twinkle" fill="#f1edff">
      <use href="#star" transform="translate(112 74) scale(.64)"/>
      <use href="#star" transform="translate(317 100) scale(.39)"/>
      <use href="#star" transform="translate(762 208) scale(.72)"/>
      <use href="#star" transform="translate(550 307) scale(.4)"/>
    </g>
    <g class="twinkle twinkle-delayed" fill="#bff5ff">
      <use href="#star" transform="translate(143 263) scale(.76)"/>
      <use href="#star" transform="translate(590 66) scale(.59)"/>
      <use href="#star" transform="translate(810 148) scale(.43)"/>
      <use href="#star" transform="translate(320 253) scale(.45)"/>
    </g>
    <g class="meteor" opacity="0">
      <path d="M676 126L740 82 665 131Z" fill="url(#shoot)"/>
      <circle cx="675" cy="125" r="2.3" fill="#fff"/>
    </g>

    <use href="#ring" fill="none" stroke="#ae9bef" stroke-opacity=".26" stroke-width="1.15"/>
    <use href="#ring" class="satellite" fill="none" stroke="#8cf5ff" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1.5 98.5"/>
    <ellipse cx="440" cy="175" rx="264" ry="105" fill="url(#shade)"/>
    <text x="440" y="177" text-anchor="middle" dominant-baseline="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="113" letter-spacing="-6" fill="url(#word)">BoBoDai</text>
  </g>
  <rect x=".75" y=".75" width="878.5" height="348.5" rx="23.25" fill="none" stroke="#a494f0" stroke-opacity=".45" stroke-width="1.5"/>
</svg>
