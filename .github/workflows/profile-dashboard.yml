name: Update profile dashboard

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-dashboard.yml'
      - 'scripts/mission-control.svg'
      - 'scripts/update-dashboard.mjs'

permissions:
  contents: write

concurrency:
  group: profile-dashboard

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Refresh the dashboard
        run: node scripts/update-dashboard.mjs
      - name: Publish updated data
        run: |
          git add -- assets/orbital-dashboard.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Refresh profile activity dashboard'
          git push origin HEAD:main
