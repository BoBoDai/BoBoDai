<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title description">
  <title id="title">BoBoDai · Mission Control</title>
  <desc id="description">{{SUMMARY}}</desc>
  <style>
    text { font-family: ui-monospace, Menlo, Consolas, monospace; }
    .label { fill: #4d5753; font-size: 13px; letter-spacing: 1px; }
    .section { fill: #242e32; font-size: 17px; font-weight: 700; letter-spacing: 1.5px; }
    .metric { fill: #243239; font-weight: 800; }
    .screen-label { fill: #bdccc8; }
    .screen-title { fill: #f3f1dd; }
    .sweep { transform-origin: 799px 62px; animation: sweep 8s linear infinite; }
    .beacon { animation: beacon 3s ease-in-out infinite; }
    @keyframes sweep { to { transform: rotate(360deg); } }
    @keyframes beacon { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      .sweep, .beacon { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="enamel" x2="1" y2="1">
      <stop stop-color="#faf6e9"/>
      <stop offset=".58" stop-color="#e9e4d7"/>
      <stop offset="1" stop-color="#d6d3c7"/>
    </linearGradient>
    <linearGradient id="screen" x2="0" y2="1">
      <stop stop-color="#23343d"/>
      <stop offset="1" stop-color="#132129"/>
    </linearGradient>
    <radialGradient id="viewport">
      <stop stop-color="#335563"/>
      <stop offset="1" stop-color="#16272f"/>
    </radialGradient>
    <linearGradient id="heat" x2="1" y2="1">
      <stop stop-color="#f4c272"/>
      <stop offset="1" stop-color="#e09a50"/>
    </linearGradient>
    <pattern id="stars" width="137" height="89" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="18" r=".8" fill="#c2cfbf" opacity=".67"/>
      <circle cx="39" cy="72" r="1.15" fill="#efe9d2" opacity=".53"/>
      <circle cx="86" cy="49" r=".65" fill="#d8ad76" opacity=".65"/>
      <circle cx="111" cy="14" r=".72" fill="#9ebdb9" opacity=".7"/>
      <circle cx="127" cy="81" r=".62" fill="#9ebdb9" opacity=".55"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(36)">
      <rect width="2" height="8" fill="#b9573d" opacity=".67"/>
    </pattern>
    <clipPath id="card"><rect x="1" y="1" width="898" height="428" rx="18"/></clipPath>
    <clipPath id="radar"><circle cx="799" cy="62" r="31"/></clipPath>
    <path id="spark" d="M0-7 1-1 7 0 1 1 0 7-1 1-7 0-1-1Z"/>
  </defs>
  <g clip-path="url(#card)">
    <rect width="900" height="430" fill="url(#enamel)"/>
    <path d="M26 126H872M26 384H872" stroke="#b2ac98"/>
    <path d="M451 28H850L873 51V109H473L451 88Z" fill="url(#viewport)" stroke="#263941" stroke-width="2"/>
    <path d="M457 34H846L867 55V103H477L457 85Z" fill="url(#stars)" stroke="#61747a"/>
    <path d="M476 83Q571 38 675 67T751 59M483 75Q600 29 697 48" stroke="#7d9ca0" stroke-opacity=".53" stroke-dasharray="2 6" fill="none"/>
    <g fill="#d9e6dd">
      <use href="#spark" transform="translate(500 74) scale(.45)"/>
      <use class="beacon" href="#spark" transform="translate(547 53) scale(.73)"/>
      <use href="#spark" transform="translate(594 49) scale(.4)"/>
      <use href="#spark" transform="translate(643 66) scale(.62)"/>
      <use href="#spark" transform="translate(717 81) scale(.39)"/>
    </g>

    <rect x="29" y="29" width="6" height="70" rx="1" fill="#ab4836"/>
    <text x="49" y="50" font-size="14" font-weight="800" letter-spacing="3.4" fill="#864335">MISSION CONTROL</text>
    <text x="46" y="98" class="metric" font-size="55" letter-spacing="-2.8">BoBoDai</text>
    <g transform="translate(313 83)">
      <path d="M0 0h22l-6 10h-22z" fill="#486b80"/>
      <path d="M25 0h22l-6 10h-22z" fill="#b9914d"/>
      <path d="M50 0h22l-6 10h-22z" fill="#bd6a3d"/>
      <path d="M75 0h22l-6 10h-22z" fill="#a5493a"/>
    </g>

    <g fill="none" stroke="#7c9595">
      <circle cx="799" cy="62" r="35"/>
      <circle cx="799" cy="62" r="23"/>
      <circle cx="799" cy="62" r="11"/>
      <path d="M764 62H834M799 27V97" opacity=".63"/>
      <ellipse cx="799" cy="62" rx="53" ry="17" transform="rotate(-28 799 62)" stroke="#d3a96d" stroke-dasharray="3 3"/>
    </g>
    <g clip-path="url(#radar)">
      <g class="sweep">
        <path d="M799 62L771 50A31 31 0 0 1 799 31Z" fill="#b0d6ce" opacity=".32"/>
        <path d="M799 62V31" stroke="#c2e7dc" stroke-width="1.7"/>
      </g>
      <circle class="beacon" cx="810" cy="54" r="2.6" fill="#ec9f57"/>
    </g>
    <path d="M27 114H239L251 126H427" fill="none" stroke="#a5503c" stroke-width="1.5"/>

    <path d="M28 152H285L300 167V365L288 377H28Z" fill="#f5f0e1" stroke="#9a9588"/>
    <path d="M316 167L331 152H872V365L860 377H316Z" fill="url(#screen)" stroke="#4d5450"/>
    <path d="M28 203V152H112M316 194V167L331 152H418" fill="none" stroke="#a0604c" stroke-width="1.5"/>
    <path d="M46 191H282" stroke="#b6ae9d"/><path d="M335 191H853" stroke="#697a77"/>

    <text x="48" y="178" class="section">PULL REQUESTS</text>
    <rect x="261" y="168" width="20" height="7" rx="2" fill="url(#hatch)"/>
    <text x="164" y="281" text-anchor="middle" class="metric" font-size="78">{{PRS_MERGED}}</text>
    <text x="164" y="308" text-anchor="middle" class="section">MERGED</text>
    <path d="M48 326H280" stroke="#c6bfb0"/>
    <text x="48" y="356" class="label">LAST 90 DAYS</text>

    <text x="337" y="178" class="section screen-title">COMMIT SIGNAL</text>
    <text x="852" y="177" text-anchor="end" class="label screen-label">{{ACTIVE_DAYS}}/28 DAYS ACTIVE</text>
    {{CHART}}
    <text x="337" y="356" class="label screen-label">LOW</text>
    <g transform="translate(373 344)">
      <rect width="13" height="13" rx="2" fill="#283740" stroke="#566368"/>
      <rect x="19" width="13" height="13" rx="2" fill="#42677a"/>
      <rect x="38" width="13" height="13" rx="2" fill="#6d8e91"/>
      <rect x="57" width="13" height="13" rx="2" fill="#bf985d"/>
      <rect x="76" width="13" height="13" rx="2" fill="url(#heat)"/>
    </g>
    <text x="473" y="356" class="label screen-label">HIGH</text>
    <text x="851" y="356" text-anchor="end" class="label screen-label">{{COMMITS}} COMMITS · 28 DAYS</text>

    <circle cx="33" cy="399" r="3.3" fill="#6c8075"/>
    <text x="46" y="404" class="label">PUBLIC DATA / DEFAULT-BRANCH COMMITS</text>
    <text x="870" y="404" class="label" text-anchor="end">UPDATED {{UPDATED}} UTC</text>
  </g>
  <rect x=".75" y=".75" width="898.5" height="428.5" rx="18" fill="none" stroke="#958f7e" stroke-width="1.5"/>
</svg>
